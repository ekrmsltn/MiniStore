services:
  ministore:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ministore
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 3000
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
